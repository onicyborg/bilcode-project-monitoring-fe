name: bilcode-monitoring-frontend
services:
  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE in .deployment.env}
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        format: raw
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3100
    ports:
      - 127.0.0.1:3100:3100
    networks: [application]
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3100/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  application:
    name: bilcode-monitoring-services
    external: true
